[package]
name = "kolom-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tower-http = { version = "0.5", features = ["fs", "cors", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
futures-util = "0.3"

[profile.release]
opt-level = 3
# Kept light on purpose: a small free build machine can run out of memory with full LTO.
lto = false
codegen-units = 16
strip = true
